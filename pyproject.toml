[project]
name = "ai-course"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feature-engine>=1.9.4",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "shap>=0.51.0",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.2.0",
]
